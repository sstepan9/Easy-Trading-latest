command.help.1=Available commands:
command.help.2=/market - open market
command.help.3=/market my - open only your listings
command.help.4=/market seller <player> - filter market by seller
command.help.5=/market search <item> - filter market by item
command.help.6=/market sell <price> - list held item
command.help.7=/market pur | /market purchase - start a purchase order
command.help.8=/market relist <listingId> [price] - refresh your listing
command.help.9=/market cancelall - remove all your listings
command.help.10=/market sellto <amount> - sell item to bank
command.help.11=/market buyfrom <resource> <amount> - buy item from bank
command.help.12=/market send <nick> <amount> - transfer money
command.help.13=/market trade <player> - send a trade request
command.help.14=/market trade accept - accept a trade request
command.help.15=/market trade decline - decline a trade request
command.help.16=/market team [name] - team balance
command.help.17=/market history - transaction history
command.help.18=/market limits - remaining bank limits
command.help.19=/market hide | /market show - hide/show balance display
command.help.20=/market bankreload - reload bank rates
command.help.21=/market clearlimits - reset bank limits
command.help.22=/market change <percent> - set bank tax
command.help.23=/market ads <limit> - set promoted listings limit

