command.help.1=Доступные команды:
command.help.2=/market - открыть рынок
command.help.3=/market my - открыть только ваши объявления
command.help.4=/market seller <player> - отфильтровать рынок по продавцу
command.help.5=/market search <item> - отфильтровать рынок по предмету
command.help.6=/market sell <price> - выставить предмет из руки
command.help.7=/market pur | /market purchase - открыть меню заказа на покупку
command.help.8=/market relist <listingId> [price] - обновить своё объявление
command.help.9=/market cancelall - снять все ваши объявления
command.help.10=/market sellto <amount> - продать предмет банку
command.help.11=/market buyfrom <resource> <amount> - купить ресурс у банка
command.help.12=/market send <nick> <amount> - перевести деньги
command.help.13=/market trade <player> - отправить запрос на обмен
command.help.14=/market trade accept - принять запрос на обмен
command.help.15=/market trade decline - отклонить запрос на обмен
command.help.16=/market team [name] - баланс команды
command.help.17=/market history - история операций
command.help.18=/market limits - оставшиеся банковские лимиты
command.help.19=/market hide | /market show - скрыть/показать HUD баланса
command.help.20=/market bankreload - перезагрузить банковские курсы
command.help.21=/market clearlimits - сбросить банковские лимиты
command.help.22=/market change <percent> - установить налог банка
command.help.23=/market ads <лимит> - установить лимит продвигаемых лотов

