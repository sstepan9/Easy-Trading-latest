import java.util.Locale

plugins {
    id 'java'
}

group = 'com.easytrading'

def mcVersion = project.findProperty('mc_version') ?: '1.21.x'
def releasePeriod = project.findProperty('release_period') ?: new Date().format('MM.yy')
def releaseIteration = project.findProperty('release_iteration') ?: '01'
def modVersion = project.findProperty('mod_version') ?: "${mcVersion}-${releasePeriod}.${releaseIteration}"
def platformTarget = (project.findProperty('platform_target') ?: 'universal').toString().toLowerCase(Locale.ROOT)
version = modVersion

base {
    archivesName = platformTarget == 'folia'
            ? 'EasyTrading-Folia'
            : (platformTarget == 'universal' ? 'EasyTrading-Universal' : 'EasyTrading-Bukkit')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url = 'https://repo.aikar.co/nexus/content/groups/aikar/' }
    maven { url = 'https://jitpack.io' }
}

dependencies {
    if (platformTarget == 'folia') {
        compileOnly 'dev.folia:folia-api:1.21.11-R0.1-SNAPSHOT'
    } else {
        compileOnly 'org.spigotmc:spigot-api:1.21.1-R0.1-SNAPSHOT'
    }
    compileOnly 'com.github.MilkBowl:VaultAPI:1.7.1'
    implementation 'net.kyori:adventure-api:4.17.0'
    implementation 'net.kyori:adventure-text-serializer-legacy:4.17.0'
    implementation 'net.kyori:adventure-text-serializer-plain:4.17.0'
    implementation 'net.kyori:adventure-platform-bukkit:4.3.3'

    // Keep the core trade/economy invariants executable without a server.
    // JUnit is test-only and does not get bundled into the plugin jar.
    testImplementation platform('org.junit:junit-bom:5.11.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // EconomyData is deliberately server-independent, but its JSON persistence
    // uses Gson supplied by the server API at runtime. Add it only to tests.
    testRuntimeOnly 'com.google.code.gson:gson:2.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

processResources {
    filesMatching('plugin.yml') {
        expand(
                version: project.version,
                foliaSupported: platformTarget == 'folia' || platformTarget == 'universal'
        )
    }
}
