# Security settings for direct player-to-player trades.
trade:
  # When enabled, players in Creative or Spectator cannot request, accept, or
  # take part in a direct trade. Disable only on servers where that is intended.
  block-creative-and-spectator: true
  # Default policy for incoming direct-trade requests: all, radius-50,
  # radius-100, radius-150, or none. Players can override this in /market config.
  request-mode: all

market:
  # Mark items handled in Creative and reject them from /market sell and
  # /market sellto. Disable only if your server intentionally allows this.
  block-creative-items: true

hud:
  # Balance display: tab-footer (only visible while holding Tab), boss-bar, or none.
  mode: tab-footer
  # Default balance number format: grouped (12,450) or compact (12.4K).
  number-format: grouped

updates:
  # Check Modrinth for a newer EasyTrading release after startup.
  enabled: true
  # Notify online administrators when they join while an update is available.
  notify-admins: true
